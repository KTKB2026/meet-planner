      '<div class="fp' + (d.fpClosed ? ' closed' : '') + '" id="d-fp"><div class="fp-head" data-act="fptoggle"><span>Flight plan</span><span class="fp-sum" id="d-fpsum"></span><span id="d-fpchev">' + (d.fpClosed ? '&#9654;' : '&#9660;') + '</span></div>' +
        '<div class="fp-body"><div class="fp-in">' +
          fpField("start", "Session start", "time") + fpField("a", "Lifters before this flight", "num") + fpField("b", "Lifters in this flight", "num") +
          fpField("c", "Lifters after", "num") + fpField("pos", "Spot in flight", "num") + fpField("brk", "Break min", "num") +
        '</div><div id="d-fpout"></div>' +
        '<div class="fp-note">Fill from LiftingCast in the morning. Times assume about ' + num(MD.minutesPerAttempt) + ' min per attempt and the break you enter between lifts. "Spot" is the place in round 1 of the flight (lightest opener goes first). Set count covers the opener only.</div></div></div>' +

      '<div class="collar"><span>Plate math: ' + num(C.plates.barKg) + ' kg bar</span><div class="tog' + (d.collars ? ' on' : '') + '" id="d-tog" data-act="collar"></div><span id="d-collarlab">' + (d.collars ? '+ 2.5 kg collars' : 'no collars') + '</span></div>' +
      '<div class="dhint">Tap a weight to edit. Tap the pill to mark good / miss / clear. Small numbers under a weight are the Safe / Moderate / Hard options: tap one to use it. Subtotals update live.</div>' +

      '<div id="d-lifts"></div>' +

      '<div class="chase"><div class="chase-head">Placement chase calc</div>' +
        '<div class="chase-in"><label for="d-rival">Rival total (or projected total) to beat:</label><input id="d-rival" inputmode="decimal" placeholder="kg" value="' + esc(d.rival || "") + '"></div>' +
        '<div class="chase-out"><div class="c"><div class="cl">' + esc(shortOf(C.lifts[C.lifts.length - 1])) + ' to match</div><div class="cv" id="d-match">--</div><div class="cn" id="d-matchn"></div></div>' +
        '<div class="c"><div class="cl">' + esc(shortOf(C.lifts[C.lifts.length - 1])) + ' to beat (+2.5)</div><div class="cv" id="d-beat">--</div><div class="cn" id="d-beatn"></div></div></div>' +
        '<div class="chase-note">Uses the live subtotal (best good lift on each, or the planned 2nd if nothing is marked yet). Equal totals go to the lighter lifter. Green = at or under the training max, amber = up to the Hard 3rd, red = past it.</div></div>' +

      dayReference() +
      '<button class="reset" data-act="reset">Reset meet day for ' + esc(firstName()) + '</button>' +
      '<footer>Edits, marks, notes, and times save on this device only.</footer>';

    renderLifts(); renderFPOut(); syncCnum(); tick();
  }
  function fpField(key, label, kind) {
    var v = dayState().fp[key] || "";
    return '<div><label>' + label + '</label><input data-fp="' + key + '" ' +
      (kind === "time" ? 'type="time"' : 'inputmode="numeric" placeholder="' + (key === "brk" ? "0" : "#") + '"') + ' value="' + esc(v) + '"></div>';
  }
  function boardUrl() {
    var u = String(dayState().board || "").trim();
    return /^https:\/\//i.test(u) ? u : "";
  }
  function dayReference() {
    var h = '<h2>Reference numbers</h2><div class="dcard">';
    C.lifts.forEach(function (lift) {
      var b = athlete.priorBests && athlete.priorBests[lift.key];
      h += '<div class="drow"><span class="k">' + esc(lift.name) + ' max / prior best</span><span class="v">' + num(tm(lift.key)) + ' · ' +
        (b ? num(b.kg) + ' (' + esc(shortDate(b.date)) + ')' : '--') + '</span></div>';
    });
    h += '</div>';
    var fl = athlete.flags || [];
    if (fl.length) {
      h += '<h2>Flags</h2>' + fl.map(function (x) { return '<div class="dnote"><b>' + esc(x.type) + ':</b> ' + esc(x.text) + '</div>'; }).join("");
    }
    return h;
  }

  // ----- render: lift cards, strips, warm-ups -----
  function renderLifts() {
    var d = dayState(), h = "", last = C.lifts.length - 1;
    C.lifts.forEach(function (lift, li) {
      var k = lift.key, b = athlete.priorBests && athlete.priorBests[k];
      var ref = 'Max ' + num(tm(k)) + (b ? ' · best ' + num(b.kg) : '');
      h += '<div class="lift l' + li + (li === 0 ? ' first' : '') + (li === last ? ' last' : '') + '" data-lift="' + k + '">' +
        '<div class="lift-head"><span class="lift-name">' + esc(lift.name) + '</span><span class="lift-ref">' + esc(ref) +
        '<button class="mini" data-act="fromplan" data-lift="' + k + '">from plan</button></span></div><div class="attempts">';
      d.att[k].forEach(function (a, i) {
        var cur = parseFloat(a.kg);
        h += '<div class="att' + (a.st === "g" ? ' good' : a.st === "m" ? ' miss' : '') + '"><div class="lab">' + esc(C.attempts[i].name) + '</div>' +
          '<input class="kg" inputmode="decimal" data-lift="' + k + '" data-i="' + i + '" value="' + esc(a.kg) + '" placeholder="--">' +
          '<div class="plates">' + esc(dayPlates(a.kg)) + '</div><div class="opts">' +
          (tm(k) ? optionGroups(k, i).map(function (g) {
            return '<button class="ochip' + (cur === g.kg ? ' on' : '') + '" data-act="opt" data-lift="' + k + '" data-i="' + i + '" data-kg="' + g.kg + '" title="' +
              g.tiers.map(function (t) { return esc(C.attemptOptions[t]); }).join(" / ") + '">' + num(g.kg) + '</button>';
          }).join("") : '') +
          '</div><div class="mark" data-act="mark" data-lift="' + k + '" data-i="' + i + '">' + (a.st === "g" ? '&#10003; GOOD' : a.st === "m" ? '&#10007; MISS' : 'SET') + '</div></div>';
      });
      h += '</div><div class="lnote"><label>Notes</label><textarea data-note="' + k + '" rows="2" placeholder="Cues, rack height, what to watch">' + esc(noteFor(k)) + '</textarea></div>';
      if (li === last) h += '<div class="final" id="d-final"></div>';

      // warm-up flow
      var fl = d.fl[k];
      h += '<div class="wu' + (d.open[k] ? ' open' : '') + '"><button class="wu-toggle" data-act="wutoggle" data-lift="' + k + '"><span>Warm-up flow</span><span>&#9662;</span></button><div class="wu-body">' +
        '<div class="wu-calc"><div class="wc-title">Back-calc warm-up times</div><div class="wc-grid">' +
          '<div class="wc-field"><label>Flight starts</label><input type="time" data-fl="0" data-lift="' + k + '" value="' + esc(fl[0] || "") + '"></div>' +
          '<div class="wc-field"><label>Position</label><input inputmode="numeric" placeholder="#" data-fl="1" data-lift="' + k + '" value="' + esc(fl[1] || "") + '"></div>' +
          '<div class="wc-field"><label>Lifters in flight</label><input inputmode="numeric" placeholder="#" data-fl="2" data-lift="' + k + '" value="' + esc(fl[2] || "") + '"></div>' +
        '</div><div class="wc-out"><div class="wc-opener">Est. opener: <b id="d-otime-' + k + '">' + openerLabel(k) + '</b></div>' +
        '<button data-act="stamp" data-lift="' + k + '">Stamp times</button></div></div>' +
        '<div class="wu-cols"><span>Time</span><span>Out</span><span>Set</span><span>kg</span><span>Reps</span><span></span></div><div class="wu-list">';
      d.wu[k].forEach(function (r, ri) {
        h += '<div class="wu-row" data-lift="' + k + '" data-r="' + ri + '">' +
          '<span class="n' + (r[4] ? ' stamped' : '') + '" data-act="delrow">' + esc(r[4] || (ri + 1)) + '</span>' +
          '<input class="aout" inputmode="numeric" data-f="5" value="' + esc(r[5] == null ? "" : r[5]) + '">' +
          '<input class="set" data-f="0" value="' + esc(r[0]) + '">' +
          '<input class="wkg" inputmode="decimal" data-f="1" value="' + esc(r[1]) + '">' +
          '<input class="reps" inputmode="numeric" data-f="2" value="' + esc(r[2]) + '">' +
          '<div class="chk' + (r[3] ? ' on' : '') + '" data-act="chk">&#10003;</div>' +
          '<span class="pl">' + esc(dayPlates(r[1])) + '</span></div>';
      });
      var wnote = (C.warmups[k] || {}).note;
      h += '</div><div class="wu-foot"><button class="wu-add" data-act="addrow" data-lift="' + k + '">+ Add warm-up set</button>' +
        '<button class="wu-btn" data-act="rebuild" data-lift="' + k + '">Rebuild from opener</button></div>' +
        '<div class="wu-tip">' + (wnote ? esc(wnote) + ' ' : '') + 'Out = lifters left before the opener when this set is due. Double-tap a row number to delete the row.</div>' +
        '</div></div></div>';

      if (li < last) {
        var next = C.lifts[li + 1];
        h += '<div class="strip"><div class="strip-head"><span class="strip-title">Subtotal after ' + esc(lift.name.toLowerCase()) +
          (li + 1 === last ? ' · forecast with ' + esc(next.name.toLowerCase()) : '') + '</span><span class="strip-live" id="d-sub-' + li + '">--</span></div>' +
          '<div class="scen" id="d-scen-' + li + '"></div></div>';
      }
    });
    $("d-lifts").innerHTML = h;
    renderForecast(); pace();
  }

  // ----- attempts / forecast / chase -----
  function bestGood(atts) { var b = 0; atts.forEach(function (a) { if (a.st === "g" && a.kg > b) b = a.kg; }); return b; }
  function liveOrPlanned(atts) {
    if (atts.some(function (a) { return a.st !== ""; })) return { val: bestGood(atts), live: true };
    return { val: atts[1] ? atts[1].kg : 0, live: false };
  }
  function renderForecast() {
    var d = dayState(), run = 0, allLive = true, last = C.lifts.length - 1;
    C.lifts.forEach(function (lift, li) {
      var atts = d.att[lift.key].map(function (a) { return { kg: parseFloat(a.kg) || 0, st: a.st || "" }; });
      if (li < last) {
        var res = liveOrPlanned(atts);
        run += res.val; allLive = allLive && res.live;
        var next = C.lifts[li + 1];
        $("d-sub-" + li).innerHTML = f1(run) + ' <small>' + (allLive ? 'LIVE' : 'PROJ') + '</small>';
        $("d-scen-" + li).innerHTML = d.att[next.key].map(function (a, i) {
          return '<div class="s' + (a.st === "m" ? ' dead' : '') + '"><div class="sl">+' + esc(shortOf(next)) + ' ' + esc(C.attempts[i].name) +
            (li + 1 === last ? ' &rarr; total' : '') + '</div><div class="sv">' + f1(run + (parseFloat(a.kg) || 0)) + '</div></div>';
        }).join("");
      } else {
        var best = bestGood(atts);
        $("d-final").innerHTML = best > 0 ? '<b>Current total: ' + f1(run + best) + '</b>' : '';
        var rival = parseFloat(d.rival), tmLast = tm(lift.key);
        var top = roundKg(tmLast * Math.max.apply(null, C.attempts[C.attempts.length - 1].pct) / 100);
        if (!isNaN(rival) && rival > 0) {
          paintChase($("d-match"), $("d-matchn"), rival - run, tmLast, top);
          paintChase($("d-beat"), $("d-beatn"), rival + 2.5 - run, tmLast, top);
        } else {
          ["d-match", "d-beat"].forEach(function (id) { $(id).textContent = "--"; $(id).className = "cv"; });
          $("d-matchn").textContent = ""; $("d-beatn").textContent = "";
        }
      }
    });
  }
  function paintChase(el, note, need, tmLast, top) {
    if (need <= 0) { el.textContent = "done"; el.className = "cv feas"; note.textContent = "Subtotal already covers it"; return; }
    el.textContent = f1(need) + " kg";
    if (need <= tmLast) { el.className = "cv feas"; note.textContent = "At or under the training max"; }
    else if (need <= top) { el.className = "cv tight"; note.textContent = "Over the training max. Coach call"; }
    else { el.className = "cv nope"; note.textContent = "Out of range today"; }
  }

  // ----- counter + pacing -----
  function syncCnum() {
    var d = dayState();
    Array.prototype.forEach.call(document.querySelectorAll("#day .lchip"), function (c) {
      c.classList.toggle("on", c.getAttribute("data-lift") === d.lift);
    });
    var el = $("d-cnum"), v = d.cnt[d.lift];
    if (document.activeElement !== el) el.value = v === null ? "" : v;
    el.classList.toggle("set", v !== null);
    renderTake();
  }
  function nextRowIdx(rows) {
    for (var i = 0; i < rows.length; i++) { if (!rows[i][3] && !isNaN(parseInt(rows[i][5], 10))) return i; }
    return -1;
  }
  function pace() {
    var d = dayState();
    C.lifts.forEach(function (lift) {
      var k = lift.key, rows = d.wu[k], els = document.querySelectorAll('#day .wu-row[data-lift="' + k + '"]');
      Array.prototype.forEach.call(els, function (e) { e.classList.remove("due", "late"); });
      var cnt = d.cnt[k]; if (cnt === null) return;
      var ni = nextRowIdx(rows); if (ni < 0 || !els[ni]) return;
      var av = parseInt(rows[ni][5], 10);
      if (cnt === av) els[ni].classList.add("due"); else if (cnt < av) els[ni].classList.add("late");
    });
    renderTake();
  }
  function renderTake() {
    var d = dayState(), el = $("d-take");
    if (!el) return;
    el.className = "take";
    var cnt = d.cnt[d.lift], folded = !!d.ctrClosed, who = firstName();
    var tag = '<b>' + esc(shortOf(liftByKey(d.lift))) + (folded && cnt !== null ? ' ' + cnt + ' out' : '') + '</b> · ';
    if (cnt === null && folded) { el.innerHTML = tag + 'counter not set'; return; }
    if (cnt === null) { el.innerHTML = 'Count the lifters before ' + esc(who) + ', type it in the #. Tap &minus;1 each time the bar turns over.'; return; }
    if (cnt === 0) { el.classList.add("up"); el.innerHTML = tag + esc(who.toUpperCase()) + ' IS UP.'; return; }
    var rows = d.wu[d.lift], ni = nextRowIdx(rows);
    if (ni < 0) { el.innerHTML = tag + 'Warm-ups done · ' + cnt + ' till up.'; return; }
    var r = rows[ni], av = parseInt(r[5], 10);
    var set = esc(r[1] ? r[1] + ' kg' : 'next set') + (r[2] ? ' × ' + esc(r[2]) : '');
    if (cnt > av) el.innerHTML = tag + 'Next: ' + set + ' at ' + av + ' out.';
    else if (cnt === av) { el.classList.add("due"); el.innerHTML = tag + 'TAKE NOW: ' + set + '.'; }
    else { el.classList.add("late"); el.innerHTML = tag + 'BEHIND · take ' + set + ' now.'; }
  }

  // ----- clocks -----
  function tick() {
    if (!dayOn || !$("d-sess")) return;
    var d = dayState(), now = Date.now();
    $("d-sess").classList.toggle("run", !!d.ck);
    $("d-crst").style.display = d.ck ? "" : "none";
    $("d-cltime").textContent = d.ck ? fmtElapsed(now - d.ck) : "0:00";
    $("d-clhint").textContent = d.ck ? "running" : "tap to start";
    var ls = 0;
    d.wu[d.lift].forEach(function (r) { if (r[3] && r[6] && r[6] > ls) ls = r[6]; });
    var slow = !!ls && now - ls >= 360000;
    $("d-last").classList.toggle("slow", slow);
    $("d-lstime").textContent = ls ? fmtElapsed(now - ls) : "--";
    $("d-lshint").textContent = ls ? liftByKey(d.lift).name.toLowerCase() + (slow ? " · 6:00+" : "") : "check off a warm-up";
  }
  setInterval(tick, 500);

  // ----- flight plan (one platform: every flight finishes a lift before the next lift) -----
  function fpCalc() {
    var d = dayState(), g = function (k) { var v = parseInt(d.fp[k], 10); return isNaN(v) ? null : v; };
    var a = g("a"), b = g("b"), c = g("c"), pos = g("pos") || 1, brk = g("brk") || 0;
    if (a === null) return null;
    var start = d.fp.start || "", full = b !== null && c !== null && !!start, total = (a || 0) + (b || 0) + (c || 0);
    var at = function (min) {
      var p = start.split(":"), t = new Date();
      t.setHours(+p[0], +p[1], 0, 0); t.setMinutes(t.getMinutes() + Math.round(min * MD.minutesPerAttempt));
      return t;
    };
    return C.lifts.map(function (lift, i) {
      var fs = full ? i * (3 * total + brk / MD.minutesPerAttempt) + 3 * a : (i === 0 && start ? 3 * a : null);
      return { k: lift.key, i: i, count: 3 * a + pos - 1, flightStart: fs === null ? null : at(fs), opener: fs === null ? null : at(fs + pos - 1) };
    });
  }
  function renderFPOut() {
    var out = $("d-fpout"), sum = $("d-fpsum"), r = fpCalc();
    if (!out) return;
    if (!r) { out.innerHTML = ""; sum.textContent = "not filled in"; return; }
    out.innerHTML = r.map(function (x) {
      var l = liftByKey(x.k);
      return '<div class="fp-row"><span class="lk l' + x.i + '">' + esc(shortOf(l)) + '</span><span class="tx">Count <b>' + x.count + '</b> at the start of ' + esc(l.name.toLowerCase()) +
        (x.flightStart ? '<br>This flight starts ~<b>' + fmtTime(x.flightStart) + '</b> · opener ~<b>' + fmtTime(x.opener) + '</b>' : '<br>Enter start time and all lifter counts for times') +
        '</span><button data-act="fpset" data-lift="' + x.k + '" data-n="' + x.count + '">Set count</button></div>';
    }).join("") + (r[0].flightStart ? '<div class="fp-row"><span></span><span class="tx">Copy flight start and spot into each lift\'s warm-up back-calc</span><button data-act="fpfill">Fill timers</button></div>' : '');
    sum.textContent = r.filter(function (x) { return x.opener; }).map(function (x) { return shortOf(liftByKey(x.k)) + " ~" + fmtTime(x.opener); }).join(" · ") || "counts set";
  }

  // ----- warm-up back-calc -----
  function calcOpener(k) {
    var fl = dayState().fl[k], t = fl[0], pos = parseInt(fl[1], 10);
    if (!t) return null;
    var p = t.split(":"), dt = new Date();
    dt.setHours(+p[0], +p[1], 0, 0);
    if (!isNaN(pos) && pos > 1) dt.setMinutes(dt.getMinutes() + Math.round((pos - 1) * MD.minutesPerAttempt));
    return dt;
  }
  function openerLabel(k) { var t = calcOpener(k); return t ? fmtTime(t) : "--"; }

  // ----- events -----
  function setMode(on) {
    dayOn = !!on;
    save("mode", dayOn ? "day" : "plan");
    document.body.classList.toggle("md", dayOn);
    if (dayOn) renderDay(); else renderAll();
    window.scrollTo(0, 0);
  }
  $("modeBtn").addEventListener("click", function () { setMode(true); });

  $("day").addEventListener("click", function (ev) {
    var el = ev.target.closest ? ev.target.closest("[data-act]") : null;
    if (!el) return;
    var act = el.getAttribute("data-act"), d = dayState();
    var row = el.closest(".wu-row"), k = el.getAttribute("data-lift") || (row && row.getAttribute("data-lift"));
    var i = +el.getAttribute("data-i");

    if (act === "plan") { setMode(false); return; }
    if (act === "ath") { picker.value = el.getAttribute("data-id"); setAthlete(picker.value); window.scrollTo(0, 0); return; }
    if (act === "clockreset") { ev.stopPropagation(); d.ck = null; persist(); tick(); return; }
    if (act === "clocktap") { if (!d.ck) { d.ck = Date.now(); persist(); tick(); } return; }
    if (act === "setlift") { d.lift = k; persist(); syncCnum(); pace(); tick(); return; }
    if (act === "bump") { d.cnt[d.lift] = Math.max(0, (d.cnt[d.lift] === null ? 0 : d.cnt[d.lift]) + (+el.getAttribute("data-d"))); persist(); syncCnum(); pace(); return; }
    if (act === "fold") { d.ctrClosed = !d.ctrClosed; persist(); $("d-ctr").classList.toggle("closed", d.ctrClosed); $("d-fold").innerHTML = d.ctrClosed ? "&#9660;" : "&#9650;"; renderTake(); return; }
    if (act === "board") {
      var b = $("d-board"), fr = $("d-boardframe"), u = boardUrl(), open = !b.classList.contains("open");
      if (open && !u) { $("d-boardurl").focus(); return; }
      if (open && fr.getAttribute("src") !== u) fr.setAttribute("src", u);
      b.classList.toggle("open", open);
      $("d-boardlab").innerHTML = (open ? "&#9660;" : "&#9654;") + " Live board (LiftingCast)";
      return;
    }
    if (act === "fptoggle") { d.fpClosed = !d.fpClosed; persist(); $("d-fp").classList.toggle("closed", d.fpClosed); $("d-fpchev").innerHTML = d.fpClosed ? "&#9654;" : "&#9660;"; return; }
    if (act === "fpset") { d.lift = k; d.cnt[k] = +el.getAttribute("data-n"); persist(); syncCnum(); pace(); tick(); window.scrollTo(0, 0); return; }
    if (act === "fpfill") {
      var r = fpCalc(); if (!r) return;
      r.forEach(function (x) {
        if (!x.flightStart) return;
        var p = function (n) { return (n < 10 ? "0" : "") + n; };
        d.fl[x.k] = [p(x.flightStart.getHours()) + ":" + p(x.flightStart.getMinutes()), d.fp.pos || "1", d.fp.b || ""];
      });
      persist(); renderLifts(); return;
    }
    if (act === "collar") { d.collars = !d.collars; persist(); $("d-tog").classList.toggle("on", d.collars); $("d-collarlab").textContent = d.collars ? "+ 2.5 kg collars" : "no collars"; renderLifts(); return; }
    if (act === "mark") { var a = d.att[k][i]; a.st = a.st === "g" ? "m" : a.st === "m" ? "" : "g"; persist(); renderLifts(); return; }
    if (act === "opt") { d.att[k][i].kg = num(+el.getAttribute("data-kg")); persist(); renderLifts(); return; }
    if (act === "wutoggle") { d.open[k] = !d.open[k]; persist(); el.parentNode.classList.toggle("open", d.open[k]); return; }
    if (act === "chk") { var rr = d.wu[k][+row.getAttribute("data-r")]; rr[3] = !rr[3]; rr[6] = rr[3] ? Date.now() : null; persist(); el.classList.toggle("on", rr[3]); pace(); tick(); return; }
    if (act === "addrow") { d.wu[k].push(["Warm-up", "", "", false, null, "", null]); persist(); renderLifts(); return; }
    if (act === "stamp") {
      var t0 = calcOpener(k);
      if (!t0) { $("d-otime-" + k).textContent = "set flight time"; return; }
      var n = d.wu[k].length;
      d.wu[k].forEach(function (r2, ri) {
        var t = new Date(t0);
        t.setMinutes(t.getMinutes() - Math.round((MD.lastWarmupOut + MD.warmupSpacing * (n - 1 - ri)) * MD.minutesPerAttempt));
        r2[4] = fmtTime(t);
      });
      persist(); renderLifts(); return;
    }
    if (act === "rebuild") {
      var op = parseFloat(d.att[k][0].kg);
      if (!(op > 0)) { window.alert("Enter an opener first."); return; }
      if (!window.confirm("Rebuild " + liftByKey(k).name.toLowerCase() + " warm-ups from the " + num(op) + " kg opener? Checks and edits on these rows clear.")) return;
      d.wu[k] = defaultWu(k, op); d.open[k] = true; persist(); renderLifts(); return;
    }
    if (act === "fromplan") {
      if (!window.confirm("Reload " + liftByKey(k).name.toLowerCase() + " attempts and warm-ups from the plan? Marks for this lift clear.")) return;
      d.att[k] = planAttempts(k); d.wu[k] = defaultWu(k, parseFloat(d.att[k][0].kg)); persist(); renderLifts(); return;
    }
    if (act === "reset") {
      if (!window.confirm("Reset meet day for " + firstName() + "? Attempts reload from the plan. Marks, warm-up checks, counter, and clocks clear. Notes stay.")) return;
      var keep = { board: d.board, collars: d.collars };
      saved.day = keep; persist(); renderDay(); window.scrollTo(0, 0); return;
    }
  });

  $("day").addEventListener("dblclick", function (ev) {
    var el = ev.target.closest ? ev.target.closest('[data-act="delrow"]') : null;
    if (!el) return;
    var row = el.closest(".wu-row"), d = dayState();
    d.wu[row.getAttribute("data-lift")].splice(+row.getAttribute("data-r"), 1);
    persist(); renderLifts();
  });

  $("day").addEventListener("input", function (ev) {
    var t = ev.target, d = dayState(), k = t.getAttribute("data-lift");
    if (t.classList.contains("kg")) {
      d.att[k][+t.getAttribute("data-i")].kg = t.value;
      t.parentNode.querySelector(".plates").textContent = dayPlates(t.value);
      persist(); renderForecast(); return;
    }
    var row = t.closest(".wu-row");
    if (row) {
      var rk = row.getAttribute("data-lift"), f = +t.getAttribute("data-f");
      d.wu[rk][+row.getAttribute("data-r")][f] = t.value;
      if (f === 1) row.querySelector(".pl").textContent = dayPlates(t.value);
      persist(); pace(); return;
    }
    if (t.hasAttribute("data-fl")) { d.fl[k][+t.getAttribute("data-fl")] = t.value; persist(); $("d-otime-" + k).textContent = openerLabel(k); return; }
    if (t.hasAttribute("data-fp")) { d.fp[t.getAttribute("data-fp")] = t.value; persist(); renderFPOut(); return; }
    if (t.hasAttribute("data-note")) { setNote(t.getAttribute("data-note"), t.value); return; }
    if (t.id === "d-cnum") { var v = parseInt(t.value, 10); d.cnt[d.lift] = isNaN(v) ? null : Math.max(0, v); persist(); t.classList.toggle("set", d.cnt[d.lift] !== null); pace(); return; }
    if (t.id === "d-rival") { d.rival = t.value; persist(); renderForecast(); return; }
    if (t.id === "d-boardurl") {
      d.board = t.value; persist();
      var ext = $("d-boardext"), u = boardUrl();
      if (u) { ext.setAttribute("href", u); ext.style.display = ""; } else { ext.style.display = "none"; }
      return;
    }
  });

  // ---------- 1. picker + boot ----------
  function renderAll() { renderHeader(); renderFlags(); renderTrends(); renderTMs(); renderAttempts(); renderWarmups(); renderWeek(); }

  var picker = $("picker");
  picker.innerHTML = ATHLETES.map(function (a) { return '<option value="' + esc(a.id) + '">' + esc(a.name) + '</option>'; }).join("");
  picker.addEventListener("change", function () { setAthlete(picker.value); });
  var last = load("last");
  setAthlete(last);
  picker.value = athlete.id;
  if (load("mode") === "day") setMode(true);
})();
</script>
</body>
</html>
