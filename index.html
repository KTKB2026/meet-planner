<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meet planner">
<meta name="theme-color" content="#f4f4f2">
<title>MASS meet day planner</title>
<style>
  :root {
    --bg: #f4f4f2;
    --card: #fcfcfb;
    --ink: #0b0b0b;
    --ink2: #52514e;
    --line: #dcdbd6;
    --pick: #0b0b0b;
    --bad: #d03b3b;
    --bad-bg: #fbeaea;
    --ok: #0a7a0a;
    --topset: #eb6834;
    --est: #2a78d6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 1000px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 18px; margin: 28px 0 10px; }
  h3 { font-size: 16px; margin: 0 0 8px; }
  .muted { color: var(--ink2); }
  .small { font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); }

  .topbar { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  select, input[type=number] {
    font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
    background: #fff; color: var(--ink); min-height: 44px;
  }

  .meet-name { font-size: 22px; font-weight: 700; margin: 0; }
  .facts { display: flex; flex-wrap: wrap; gap: 6px 20px; margin-top: 8px; }
  .facts b { font-weight: 600; }
  .daysout { font-size: 28px; font-weight: 700; }
  .missing { margin-top: 10px; color: var(--bad); }

  /* charts */
  .chartwrap { position: relative; }
  .chartwrap svg { width: 100%; height: auto; display: block; touch-action: pan-y; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--ink2); margin-bottom: 4px; }
  .key { display: inline-block; width: 14px; height: 0; border-top: 3px solid; vertical-align: middle; margin-right: 5px; }
  .key.dash { border-top: 2px dashed var(--ink2); }
  .tip {
    position: absolute; top: 0; left: 0; pointer-events: none; display: none;
    background: var(--ink); color: #fff; font-size: 12px; padding: 6px 8px; border-radius: 6px;
    max-width: 200px; z-index: 2;
  }
  .sets { list-style: none; margin: 10px 0 0; padding: 0; font-size: 14px; }
  .sets li { padding: 6px 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: 52px 1fr auto; gap: 8px; }
  .sets .d { color: var(--ink2); }
  .sets .e { color: var(--ink2); white-space: nowrap; }
  .sets .n { grid-column: 2 / 4; font-style: italic; }
  .sets .mv { grid-column: 2 / 4; font-size: 13px; color: var(--ink2); }
  .sets .mv button { min-height: 32px; }
  .tag { font-size: 11px; font-weight: 600; border: 1px solid var(--est); color: var(--est); border-radius: 99px; padding: 1px 7px; margin-right: 6px; }
  details { margin-top: 10px; }
  summary { cursor: pointer; font-weight: 600; font-size: 14px; padding: 6px 0; }

  /* training maxes */
  .tmrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .tmrow input { width: 110px; font-size: 20px; font-weight: 700; }
  .badge { font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 99px; border: 1px solid; }
  .badge.ok { color: var(--ok); }
  .badge.no { color: var(--bad); background: var(--bad-bg); }
  button.link { background: none; border: 0; padding: 0; font: inherit; color: var(--est); text-decoration: underline; cursor: pointer; }

  /* attempts */
  .attempt { margin-top: 12px; }
  .attempt .lbl { font-weight: 600; font-size: 14px; margin-bottom: 6px; }
  .opts { display: flex; gap: 8px; }
  .opt {
    flex: 1 1 0; min-height: 64px; padding: 8px 6px; cursor: pointer;
    border: 2px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink);
    font: inherit; text-align: center; line-height: 1.25;
  }
  .opt .t { display: block; font-size: 12px; color: var(--ink2); }
  .opt .w { display: block; font-size: 20px; font-weight: 700; }
  .opt .l { display: block; font-size: 12px; color: var(--ink2); }
  .opt.on { background: var(--pick); border-color: var(--pick); color: #fff; }
  .opt.on .t, .opt.on .l { color: #d9d8d3; }
  .attempt.bad .opt.on { background: var(--bad); border-color: var(--bad); }
  .attempt.bad .opt.on .t, .attempt.bad .opt.on .l { color: #fff; }
  .warn { color: var(--bad); font-size: 13px; font-weight: 600; margin-top: 6px; }

  .totals { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px; }
  .totals .card { flex: 1 1 220px; }
  .big { font-size: 28px; font-weight: 700; }

  /* warm-ups */
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th { text-align: left; font-size: 12px; color: var(--ink2); font-weight: 600; padding: 4px 6px 4px 0; }
  td { padding: 8px 6px 8px 0; border-top: 1px solid var(--line); vertical-align: top; }
  td.wt { font-weight: 700; white-space: nowrap; }
  .note { margin-top: 10px; padding: 10px 12px; border-left: 4px solid var(--ink); background: #fff; font-size: 14px; }

  /* flags */
  .flags { margin-top: 12px; border: 1px solid var(--bad); border-left-width: 6px; background: var(--bad-bg); border-radius: 10px; padding: 12px 14px; }
  .flags h3 { margin-bottom: 6px; }
  .flags ul { margin: 0; padding: 0; list-style: none; }
  .flags li { padding: 4px 0; font-size: 15px; }
  .flags li b { margin-right: 6px; }

  /* meet week */
  .week { list-style: none; margin: 0; padding: 0; }
  .week li { display: grid; grid-template-columns: 92px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .week li:first-child { border-top: 0; }
  .week .d { font-weight: 600; }
  .week li.today { background: #fff; outline: 2px solid var(--ink); border-radius: 6px; padding: 10px; }
  .week li.past { color: var(--ink2); }

  /* meet day mode */
  .btn { font: inherit; min-height: 44px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); cursor: pointer; }
  .toggle { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; min-height: 44px; padding: 8px 14px; border: 2px solid var(--line); border-radius: 8px; background: #fff; cursor: pointer; }
  .toggle input { width: 20px; height: 20px; }
  .toggle.on { border-color: var(--ink); }
  .h2row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 28px 0 10px; }
  .h2row h2 { margin: 0; }
  .marks { display: flex; gap: 8px; margin-top: 8px; }
  .mk { flex: 1 1 0; min-height: 44px; font: inherit; font-size: 14px; font-weight: 600; border: 2px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); cursor: pointer; }
  .mk.good.on { background: var(--ok); border-color: var(--ok); color: #fff; }
  .mk.miss.on { background: var(--bad); border-color: var(--bad); color: #fff; }
  .opt.sug { border-color: var(--est); border-style: dashed; box-shadow: 0 0 0 3px #d9e8fa; }
  .opt.sug .t::after { content: " · suggested"; color: var(--est); font-weight: 600; }
  .hint { font-size: 13px; font-weight: 600; color: var(--est); margin-bottom: 6px; }
  .result { font-size: 12px; font-weight: 600; margin-left: 6px; }
  .result.good { color: var(--ok); }
  .result.miss { color: var(--bad); }

  /* notes per lift (plan view) */
  .lnote-p { display: block; margin-top: 14px; font-size: 13px; font-weight: 600; }
  .lnote-p textarea { display: block; width: 100%; margin-top: 4px; font: inherit; font-weight: 400; font-size: 16px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); resize: vertical; }
  .btn.primary { background: var(--ink); border-color: var(--ink); color: #fff; font-weight: 600; }

  /* ===== Meet day mode: dark card, modeled on the Worlds meet day card ===== */
  #day { display: none; }
  body.md { background: #0e1116; color: #e8ebef; }
  body.md main { display: none; }
  body.md #day {
    --dink: #0e1116; --panel: #171c24; --panel2: #1f2630; --dline: #2c3540;
    --text: #e8ebef; --dim: #8b95a3;
    --c0: #e0a33c; --c1: #5fb4e6; --c2: #e0635a;
    --good: #4cc38a; --warn: #e0a33c; --stop: #e0635a;
    display: block; max-width: 560px; margin: 0 auto; padding: 14px 14px 60px;
    font-size: 16px; line-height: 1.45; color: var(--text);
  }
  #day * { -webkit-tap-highlight-color: transparent; }
  #day input, #day textarea { font-family: inherit; color: var(--text); background: transparent; border: none; outline: none; min-height: 0; padding: 0; border-radius: 0; }
  #day input:focus, #day textarea:focus { background: rgba(255,255,255,.07); border-radius: 4px; }
  #day button { font-family: inherit; }

  #day .dtop { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
  #day .eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
  #day .chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  #day .achip { font-size: 13px; font-weight: 800; border-radius: 9px; padding: 8px 11px; border: 1px solid var(--dline); background: var(--panel2); color: var(--dim); cursor: pointer; }
  #day .achip.on { background: var(--text); border-color: var(--text); color: var(--dink); }
  #day .pbtn { font-size: 12px; font-weight: 700; border-radius: 9px; padding: 8px 10px; border: 1px dashed var(--dline); background: none; color: var(--dim); cursor: pointer; }
  #day header { margin-bottom: 12px; }
  #day h1 { font-size: 28px; font-weight: 800; letter-spacing: -.02em; line-height: 1.05; margin: 0; }
  #day .sub { color: var(--dim); font-size: 13px; margin-top: 5px; }
  #day .dhint { font-size: 11px; color: var(--dim); text-align: center; margin: 0 0 14px; }

  #day .stick { position: sticky; top: 8px; z-index: 50; margin-bottom: 14px; box-shadow: 0 6px 18px rgba(0,0,0,.45); border-radius: 12px; }
  #day .clock { background: var(--panel); border: 1px solid var(--dline); border-radius: 12px 12px 0 0; display: flex; align-items: center; padding: 8px 10px; user-select: none; }
  #day .ck { flex: 1; padding: 2px 6px; }
  #day .ck + .ck { border-left: 1px solid var(--dline); }
  #day .cl-lab { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); line-height: 1.3; display: flex; justify-content: space-between; align-items: center; }
  #day .cl-time { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.02em; line-height: 1.1; }
  #day .cl-hint { font-size: 10px; color: var(--dim); }
  #day #d-sess { cursor: pointer; }
  #day #d-sess.run .cl-time { color: var(--good); }
  #day #d-last.slow .cl-time, #day #d-last.slow .cl-hint { color: var(--warn); }
  #day .crst { background: var(--panel2); border: 1px solid var(--dline); color: var(--dim); font-size: 11px; font-weight: 700; border-radius: 7px; padding: 2px 7px; cursor: pointer; }

  #day .ctr { background: var(--panel); border: 1px solid var(--dline); border-top: none; border-radius: 0 0 12px 12px; padding: 8px 10px 10px; }
  #day .ctr-top { display: flex; align-items: center; gap: 6px; }
  #day .lchips { display: flex; gap: 4px; }
  #day .lchip { font-size: 11px; font-weight: 800; letter-spacing: .06em; border-radius: 7px; padding: 6px 7px; border: 1px solid var(--dline); background: var(--panel2); color: var(--dim); cursor: pointer; }
  #day .lchip.on.l0 { color: var(--dink); background: var(--c0); border-color: var(--c0); }
  #day .lchip.on.l1 { color: var(--dink); background: var(--c1); border-color: var(--c1); }
  #day .lchip.on.l2 { color: var(--dink); background: var(--c2); border-color: var(--c2); }
  #day .cbtn { font-size: 15px; font-weight: 800; background: var(--panel2); border: 1px solid var(--dline); color: var(--text); border-radius: 9px; padding: 7px 11px; cursor: pointer; }
  #day .cbtn.minus { margin-left: auto; padding: 9px 14px; font-size: 17px; }
  #day .cbtn.plus { font-size: 12px; padding: 6px 8px; color: var(--dim); }
  #day #d-cnum { width: 52px; font-size: 22px; font-weight: 800; text-align: center; font-variant-numeric: tabular-nums; background: var(--panel2); border: 1px dashed var(--dim); border-radius: 9px; padding: 4px 0; }
  #day #d-cnum.set { border: 1px solid var(--dline); }
  #day .clab { font-size: 9px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); line-height: 1.1; }
  #day .ctr-line { display: flex; align-items: stretch; gap: 6px; margin-top: 7px; }
  #day .mini-minus { display: none; font-size: 15px; font-weight: 800; background: var(--panel2); border: 1px solid var(--dline); color: var(--text); border-radius: 8px; padding: 0 12px; cursor: pointer; }
  #day .fold { font-size: 12px; background: var(--panel2); border: 1px solid var(--dline); color: var(--dim); border-radius: 8px; padding: 0 10px; cursor: pointer; }
  #day .ctr.closed { padding-top: 6px; }
  #day .ctr.closed .ctr-top { display: none; }
  #day .ctr.closed .ctr-line { margin-top: 0; }
  #day .ctr.closed .mini-minus { display: block; }
  #day .take { flex: 1; font-size: 13px; font-weight: 600; text-align: center; padding: 6px 8px; border-radius: 8px; background: var(--panel2); color: var(--dim); }
  #day .take.due { background: rgba(224,163,60,.16); color: var(--warn); }
  #day .take.late { background: rgba(224,99,90,.16); color: var(--stop); }
  #day .take.up { background: rgba(76,195,138,.16); color: var(--good); }

  #day .board { background: var(--panel); border: 1px solid var(--dline); border-radius: 12px; margin-bottom: 14px; overflow: hidden; }
  #day .board-bar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; }
  #day .board-bar button { font-size: 13px; font-weight: 700; background: none; border: none; color: var(--text); cursor: pointer; padding: 0; flex: 1; text-align: left; }
  #day .board-bar a { font-size: 11px; color: var(--dim); }
  #day .board-url { padding: 0 14px 10px; }
  #day .board-url input { width: 100%; font-size: 16px; background: var(--panel2); border: 1px solid var(--dline); border-radius: 7px; padding: 6px 8px; }
  #day .board iframe { display: none; width: 100%; height: 72vh; border: 0; border-top: 1px solid var(--dline); background: #fff; }
  #day .board.open iframe { display: block; }

  #day .fp { background: var(--panel); border: 1px solid var(--dline); border-radius: 12px; padding: 10px 12px; margin-bottom: 14px; }
  #day .fp-head { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; gap: 8px; }
  #day .fp-sum { font-size: 12px; color: #c2c9d2; text-transform: none; letter-spacing: 0; margin-left: auto; font-variant-numeric: tabular-nums; }
  #day .fp-body { margin-top: 8px; }
  #day .fp.closed .fp-body { display: none; }
  #day .fp:not(.closed) .fp-sum { display: none; }
  #day .fp-in { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 8px; }
  #day .fp-in label { display: block; font-size: 9px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); margin-bottom: 3px; text-align: center; }
  #day .fp-in input { width: 100%; background: var(--panel2); border: 1px solid var(--dline); border-radius: 7px; font-size: 16px; font-weight: 700; text-align: center; padding: 6px 2px; font-variant-numeric: tabular-nums; color-scheme: dark; }
  #day .fp-row { display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: center; padding: 7px 0; border-top: 1px solid var(--dline); font-size: 13px; }
  #day .lk { font-weight: 800; font-size: 11px; letter-spacing: .08em; }
  #day .lk.l0 { color: var(--c0); } #day .lk.l1 { color: var(--c1); } #day .lk.l2 { color: var(--c2); }
  #day .fp-row .tx { color: #c2c9d2; line-height: 1.3; }
  #day .fp-row .tx b { color: var(--text); font-variant-numeric: tabular-nums; }
  #day .fp-row button { font-size: 11px; font-weight: 700; background: var(--panel2); border: 1px solid var(--dline); color: var(--text); border-radius: 7px; padding: 6px 8px; cursor: pointer; white-space: nowrap; }
  #day .fp-note { font-size: 11px; color: var(--dim); margin-top: 6px; }

  #day .collar { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12px; color: var(--dim); margin: -4px 0 12px; }
  #day .tog { width: 40px; height: 22px; border-radius: 11px; background: var(--panel2); border: 1px solid var(--dline); position: relative; cursor: pointer; }
  #day .tog::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--dim); transition: left .15s; }
  #day .tog.on { background: rgba(76,195,138,.25); border-color: var(--good); }
  #day .tog.on::after { left: 20px; background: var(--good); }

  #day .lift { background: var(--panel); border: 1px solid var(--dline); overflow: hidden; }
  #day .lift.first { border-radius: 14px 14px 0 0; }
  #day .lift.last { border-radius: 0 0 14px 14px; margin-bottom: 14px; }
  #day .lift-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 12px 14px 8px; }
  #day .lift-name { font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
  #day .lift.l0 .lift-name { color: var(--c0); } #day .lift.l1 .lift-name { color: var(--c1); } #day .lift.l2 .lift-name { color: var(--c2); }
  #day .lift-ref { font-size: 11px; color: var(--dim); text-align: right; }
  #day .mini { font-size: 10px; font-weight: 700; background: none; border: 1px solid var(--dline); color: var(--dim); border-radius: 6px; padding: 3px 6px; margin-left: 6px; cursor: pointer; }
  #day .attempts { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1px; background: var(--dline); }
  #day .att { background: var(--panel2); padding: 10px 4px 8px; text-align: center; }
  #day .att .lab { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
  #day .att input.kg { width: 100%; font-size: 27px; font-weight: 800; text-align: center; font-variant-numeric: tabular-nums; letter-spacing: -.02em; margin: 2px 0; padding: 2px 0; }
  #day .att .plates { font-size: 10px; color: var(--dim); font-variant-numeric: tabular-nums; min-height: 13px; }
  #day .att .opts { display: flex; justify-content: center; gap: 2px; margin-top: 5px; flex-wrap: wrap; }
  #day .att .ochip { font-size: 10px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.03em; background: none; border: 1px solid var(--dline); color: var(--dim); border-radius: 5px; padding: 4px 2px; cursor: pointer; flex: 0 0 auto; min-height: 0; }
  #day .att .ochip.on { color: var(--text); border-color: var(--dim); background: rgba(255,255,255,.06); }
  #day .att .mark { font-size: 11px; font-weight: 700; margin: 6px 4px 0; padding: 7px 0; border-radius: 6px; border: 1px solid var(--dline); color: var(--dim); cursor: pointer; user-select: none; }
  #day .att.good { background: rgba(76,195,138,.13); } #day .att.good .mark { color: var(--good); border-color: var(--good); }
  #day .att.miss { background: rgba(224,99,90,.13); } #day .att.miss .mark { color: var(--stop); border-color: var(--stop); }
  #day .lnote { padding: 8px 14px 10px; border-top: 1px solid var(--dline); }
  #day .lnote label { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); display: block; margin-bottom: 4px; }
  #day .lnote textarea { width: 100%; font-size: 16px; line-height: 1.35; color: #c2c9d2; background: var(--panel2); border-radius: 8px; padding: 7px 9px; resize: vertical; display: block; }
  #day .final { padding: 0 14px 10px; font-size: 13px; color: #c2c9d2; }
  #day .final b { color: var(--text); }

  #day .strip { background: var(--panel2); border: 1px solid var(--dline); border-top: none; border-bottom: none; margin: 0 12px; padding: 10px 12px 12px; }
  #day .strip-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; gap: 8px; }
  #day .strip-title { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
  #day .strip-live { font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #day .strip-live small { font-size: 10px; font-weight: 600; color: var(--dim); letter-spacing: .08em; }
  #day .scen { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  #day .scen .s { background: var(--dink); border: 1px solid var(--dline); border-radius: 8px; padding: 6px 4px; text-align: center; }
  #day .scen .sl { font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
  #day .scen .sv { font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; }
  #day .scen .s.dead { opacity: .35; }

  #day .wu { border-top: 1px solid var(--dline); }

  #day .wc-title { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); margin-bottom: 8px; }
  #day .wc-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 8px; }

  #day .wu-cols, #day .wu-row { display: grid; grid-template-columns: 44px 38px 1fr 58px 40px 28px; gap: 6px; align-items: center; }
  #day .wu-cols { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); padding: 4px 0 6px; }
  #day .wu-row { padding: 6px 0; border-bottom: 1px solid var(--dline); font-size: 14px; }
  #day .wu-row .n { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; cursor: pointer; }
  #day .wu-row .n.stamped { color: var(--good); font-weight: 700; }
  #day .wu-row input { font-size: 16px; font-variant-numeric: tabular-nums; padding: 4px 6px; background: var(--panel2); border-radius: 6px; width: 100%; }
  #day .wu-row input.reps, #day .wu-row input.aout { text-align: center; }
  #day .wu-row input.aout { color: var(--dim); }
  #day .wu-row .chk { width: 28px; height: 28px; border: 1px solid var(--dline); border-radius: 7px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: transparent; font-size: 14px; font-weight: 800; }
  #day .wu-row .chk.on { color: var(--good); border-color: var(--good); background: rgba(76,195,138,.12); }
  #day .wu-row .pl { grid-column: 3 / 7; font-size: 10px; color: var(--dim); margin-top: -3px; font-variant-numeric: tabular-nums; }
  #day .wu-row.due { background: rgba(224,163,60,.13); box-shadow: inset 0 0 0 1px var(--warn); border-radius: 6px; }
  #day .wu-row.late { background: rgba(224,99,90,.13); box-shadow: inset 0 0 0 1px var(--stop); border-radius: 6px; }
  #day .wu-foot { display: flex; gap: 8px; margin-top: 10px; }
  #day .wu-add { flex: 1; background: var(--panel2); border: 1px dashed var(--dline); color: var(--dim); font-size: 13px; border-radius: 8px; padding: 8px; cursor: pointer; }
  #day .wu-tip { font-size: 11px; color: var(--dim); margin-top: 8px; }

  #day .chase { background: var(--panel); border: 1px solid var(--dline); border-radius: 14px; padding: 12px 14px; margin-bottom: 14px; }
  #day .chase-head { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); margin-bottom: 10px; }
  #day .chase-in { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
  #day .chase-in label { font-size: 13px; color: var(--dim); flex: 1; }
  #day .chase-in input { background: var(--panel2); border: 1px solid var(--dline); border-radius: 8px; font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; width: 110px; padding: 6px 10px; text-align: center; }

  #day .cl { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
  #day .cv { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; margin-top: 2px; }
  #day .cn { font-size: 10px; color: var(--dim); margin-top: 2px; min-height: 12px; }
  #day .cv.feas { color: var(--good); } #day .cv.tight { color: var(--warn); } #day .cv.nope { color: var(--stop); }
  #day .chase-note { font-size: 11px; color: var(--dim); margin-top: 8px; }

  #day h2 { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); margin: 26px 0 10px; display: flex; align-items: center; gap: 10px; font-weight: 700; }
  #day h2::after { content: ""; flex: 1; height: 1px; background: var(--dline); }
  #day .dcard { background: var(--panel); border: 1px solid var(--dline); border-radius: 14px; padding: 4px 14px; margin-bottom: 12px; }
  #day .drow { display: flex; justify-content: space-between; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--dline); font-size: 14px; }
  #day .drow:last-child { border-bottom: none; }
  #day .drow .k { color: var(--dim); flex-shrink: 0; }
  #day .drow .v { text-align: right; font-variant-numeric: tabular-nums; }
  #day .dnote { font-size: 13px; color: #c2c9d2; background: var(--panel); border: 1px solid var(--dline); border-left: 3px solid var(--stop); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
  #day .dnote b { color: var(--text); }
  #day .reset { display: block; margin: 26px auto 0; font-size: 12px; font-weight: 700; background: none; border: 1px solid var(--dline); color: var(--dim); border-radius: 8px; padding: 9px 14px; cursor: pointer; }
  #day footer { margin-top: 16px; font-size: 11px; color: var(--dim); text-align: center; }

  /* print sheet: hidden on screen, the only thing on paper */
  #sheet { display: none; }
  @media print {
    @page { margin: 12mm; }
    body { background: #fff; }
    main { display: none; }
    #day, body.md #day { display: none !important; }
    body.md { background: #fff; color: #000; }
    #sheet { display: block; font-size: 12px; color: #000; }
    #sheet h1 { font-size: 20px; margin: 0; }
    #sheet h2 { font-size: 14px; margin: 14px 0 4px; }

    #sheet table { width: 100%; border-collapse: collapse; font-size: 12px; }
    #sheet th, #sheet td { border: 1px solid #000; padding: 5px 6px; text-align: left; vertical-align: top; color: #000; font-size: 12px; }
    #sheet .pick { font-size: 18px; font-weight: 700; }
    #sheet .alts { font-size: 10px; margin-top: 2px; }
    #sheet .box { display: inline-block; width: 11px; height: 11px; border: 1px solid #000; margin: 0 3px 0 8px; vertical-align: middle; }
    #sheet .wu { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    #sheet .wu h3 { font-size: 12px; margin: 0 0 3px; }
    #sheet .wu td, #sheet .wu th { padding: 3px 5px; font-size: 11px; }
  }
</style>

<body>
<main>
  <div class="topbar">
    <h1>MASS meet day planner</h1>
    <div class="tmrow">
      <label>Athlete <select id="picker"></select></label>
      <button class="btn primary" id="modeBtn">Meet day mode</button>
      <button class="btn" id="printBtn">Print handler sheet</button>
    </div>
  </div>

  <section id="header"></section>
  <section id="flags"></section>

  <h2>Trends since <span id="histStart"></span></h2>
  <p class="muted small" id="histNote"></p>
  <section id="trends" class="grid"></section>

  <h2>Training maxes</h2>
  <p class="muted small">Edit a number and everything below recalculates. Edits save on this device only.</p>
  <section id="tms" class="grid"></section>

  <h2>Attempt selection</h2>
  <p class="muted small">Tap one option per attempt. Tap again to clear it. Notes save on this device.</p>
  <section id="attempts" class="grid"></section>
  <section id="totals" class="totals"></section>

  <h2>Warm-ups</h2>
  <section id="warmups" class="grid"></section>
  <div class="note" id="timing"></div>

  <h2>Meet week plan</h2>
  <section id="week" class="card"></section>
</main>
<div id="day"></div>
<section id="sheet"></section>

<script src="data/config.js"></script>
<script src="data/athletes.js"></script>
<!-- Private notes and flags. Only exists on Kyle's Mac. Missing is fine. -->
<script src="data/private.js"></script>
<script>
(function () {
  "use strict";
  var C = window.CONFIG, ATHLETES = window.ATHLETES || [];
  var $ = function (id) { return document.getElementById(id); };
  var KEY = "meetplanner:v1:";
  var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

  if (!C || !ATHLETES.length) {
    $("header").innerHTML = '<p class="card">Could not load data/config.js or data/athletes.js. Check both files for a typo.</p>';
    return;
  }

  // Fold in data/private.js when it is there (Kyle's Mac only).
  var PRIV = window.PRIVATE || {};
  ATHLETES.forEach(function (a) {
    var p = PRIV[a.id];
    if (!p) return;
    if (p.fullName) a.name = p.fullName;
    if (p.legacyId) a._legacyId = p.legacyId;
    if (p.historyNote) a.historyNote = p.historyNote;
    if (p.flags) a.flags = p.flags;
    Object.keys(p.priorBestNotes || {}).forEach(function (k) {
      if (a.priorBests && a.priorBests[k]) a.priorBests[k].note = p.priorBestNotes[k];
    });
    Object.keys(p.notes || {}).forEach(function (k) {
      var parts = k.split("|");
      ((a.log || {})[parts[0]] || []).forEach(function (e) { if (e.date === parts[1]) e.note = p.notes[k]; });
    });
  });

  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    try { navigator.serviceWorker.register("sw.js").catch(function () {}); } catch (e) {}
  }

  // ---------- storage (page still works if storage is blocked) ----------
  function load(key) {
    try { var s = window.localStorage.getItem(KEY + key); return s ? JSON.parse(s) : null; }
    catch (e) { return null; }
  }
  function save(key, val) {
    try { window.localStorage.setItem(KEY + key, JSON.stringify(val)); } catch (e) {}
  }

  // ---------- helpers ----------
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function parseDate(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function shortDate(s) { var d = parseDate(s); return MONTHS[d.getMonth()] + " " + d.getDate(); }
  function longDate(s) { var d = parseDate(s); return DAYS[d.getDay()] + ", " + MONTHS[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear(); }
  function roundTo(x, inc) { return Math.floor(x / inc + 0.5 + 1e-9) * inc; }
  function roundKg(x) { return roundTo(x, C.roundingKg); }
  function num(x) { return String(Math.round(x * 100) / 100); }
  function lb(kg) { return Math.round(kg * C.kgToLb); }
  function epley(kg, reps) { return reps <= 1 ? kg : kg * (1 + reps / 30); }
  function orInsert(val, label) { return val ? esc(val) : '<span class="muted">[Insert ' + label + ']</span>'; }

  // ---------- state ----------
  var athlete, saved;

  function setAthlete(id) {
    athlete = ATHLETES.filter(function (a) { return a.id === id; })[0] || ATHLETES[0];
    saved = load(athlete.id) || (athlete._legacyId && load(athlete._legacyId)) || {};
    saved.tm = saved.tm || {};
    saved.picks = saved.picks || {};
    saved.marks = saved.marks || {};
    saved.moved = saved.moved || {};
    save("last", athlete.id);
    renderAll();
    if (dayOn) renderDay();
  }
  function persist() { save(athlete.id, saved); }

  function tm(liftKey) {
    var v = saved.tm[liftKey];
    if (typeof v === "number" && v > 0) return v;
    var f = athlete.trainingMaxes && athlete.trainingMaxes[liftKey];
    return f ? f.kg : 0;
  }
  function picks(liftKey) {
    var p = saved.picks[liftKey];
    if (!p) { p = saved.picks[liftKey] = [null, null, null]; }
    return p;
  }

  // Sets logged under the wrong exercise name can be moved between a lift's
  // main list and its other list (config.js "others"). A move is saved per set.
  function moveKey(listKey, e) { return listKey + "|" + e.date + "|" + e.kg; }
  function listName(lift, listKey) {
    if (listKey === lift.key) return lift.name;
    var o = (lift.others || []).filter(function (x) { return x.key === listKey; })[0];
    return o ? o.name : listKey;
  }
  function listEntries(lift, listKey) {
    var log = athlete.log || {}, others = lift.others || [], out = [];
    var take = function (src, wantMoved) {
      (log[src] || []).forEach(function (e) {
        if (!!saved.moved[moveKey(src, e)] !== wantMoved) return;
        out.push({ date: e.date, kg: e.kg, reps: e.reps, text: e.text, note: e.note, _src: src, _moved: wantMoved });
      });
    };
    take(listKey, false);
    if (listKey === lift.key) others.forEach(function (o) { take(o.key, true); });
    else if (others.length && others[0].key === listKey) take(lift.key, true);
    return out
      .filter(function (e) { return !athlete.historyStart || e.date >= athlete.historyStart; })
      .sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
  }
  // Heaviest single in a lift's main list (after any moves). Latest date wins a tie.
  function heaviestSingle(lift) {
    var best = null;
    listEntries(lift, lift.key).forEach(function (e) {
      if (e.reps <= 1 && (!best || e.kg >= best.kg)) best = e;
    });
    return best;
  }

  // Options for one attempt. Tiers that round to the same weight merge into one group.
  function optionGroups(liftKey, attemptIdx) {
    var groups = [];
    C.attempts[attemptIdx].pct.forEach(function (pct, tier) {
      var w = roundKg(tm(liftKey) * pct / 100);
      var last = groups[groups.length - 1];
      if (last && last.kg === w) { last.tiers.push(tier); last.pcts.push(pct); }
      else groups.push({ kg: w, tiers: [tier], pcts: [pct] });
    });
    return groups;
  }
  // A pick is a tier number (0, 1, 2) or "r" = repeat the weight before it.
  function pickedKg(liftKey, attemptIdx) {
    var tier = picks(liftKey)[attemptIdx];
    if (tier === null || tier === undefined) return null;
    if (tier === "r") return attemptIdx > 0 ? pickedKg(liftKey, attemptIdx - 1) : null;
    return roundKg(tm(liftKey) * C.attempts[attemptIdx].pct[tier] / 100);
  }
  function todayStr() {
    var t = new Date(), p = function (n) { return (n < 10 ? "0" : "") + n; };
    return t.getFullYear() + "-" + p(t.getMonth() + 1) + "-" + p(t.getDate());
  }

  // ---------- 2. meet header ----------
  function renderHeader() {
    var m = athlete.meet || {};
    var days = "";
    if (m.date) {
      var t = new Date(); t = new Date(t.getFullYear(), t.getMonth(), t.getDate());
      var n = Math.round((parseDate(m.date) - t) / 86400000);
      days = n > 1 ? n + " days out" : n === 1 ? "1 day out" : n === 0 ? "Meet day" : Math.abs(n) + " days ago";
    }
    var missing = [];
    if (!m.name) missing.push("meet name");
    if (!m.date) missing.push("meet date");
    if (!m.federation) missing.push("federation");
    if (!m.weightClass) missing.push("weight class");
    if (!m.weighIn) missing.push("weigh-in time");

    $("header").innerHTML =
      '<div class="card" style="margin-top:14px">' +
        '<div class="topbar"><div>' +
          '<p class="meet-name">' + esc(athlete.name) + '</p>' +
          '<div>' + orInsert(m.name, "meet name") + '</div>' +
        '</div><div class="daysout">' + esc(days) + '</div></div>' +
        '<div class="facts">' +
          '<span><b>Date</b> ' + (m.date ? esc(longDate(m.date)) : orInsert("", "meet date")) + '</span>' +
          '<span><b>Federation</b> ' + orInsert(m.federation, "federation") + '</span>' +
          '<span><b>Weight class</b> ' + orInsert(m.weightClass, "weight class") + '</span>' +
          '<span><b>Weigh-in</b> ' + orInsert(m.weighIn, "weigh-in time") + '</span>' +
        '</div>' +
        (missing.length ? '<div class="missing small">Missing: ' + esc(missing.join(", ")) + '</div>' : '') +
      '</div>';
  }

  // ---------- 3. trends ----------
  function chartSvg(entries, best, x0, x1) {
    var W = 340, H = 190, L = 34, R = 10, T = 12, B = 22;
    var vals = [];
    entries.forEach(function (e) { vals.push(e.kg, epley(e.kg, e.reps)); });
    if (best) vals.push(best.kg);
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    var step = [5, 10, 20, 25, 50, 100].filter(function (s) { return (hi - lo) / s <= 5; })[0] || 100;
    lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
    if (hi === lo) hi = lo + step;
    var X = function (d) { return L + (d - x0) / (x1 - x0) * (W - L - R); };
    var Y = function (v) { return T + (hi - v) / (hi - lo) * (H - T - B); };
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Top sets and estimated max over time">';

    for (var v = lo; v <= hi + 1e-9; v += step) {
      s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="#e6e5e0" stroke-width="1"/>' +
           '<text x="' + (L - 5) + '" y="' + (Y(v) + 4) + '" text-anchor="end" font-size="10" fill="#52514e">' + v + '</text>';
    }
    var m = new Date(x0.getFullYear(), x0.getMonth() + 1, 1);
    while (m <= x1) {
      s += '<text x="' + X(m) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="10" fill="#52514e">' + MONTHS[m.getMonth()] + '</text>' +
           '<line x1="' + X(m) + '" x2="' + X(m) + '" y1="' + (H - B) + '" y2="' + (H - B + 4) + '" stroke="#b9b8b2"/>';
      m = new Date(m.getFullYear(), m.getMonth() + 1, 1);
    }
    if (best) {
      s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(best.kg) + '" y2="' + Y(best.kg) + '" stroke="#52514e" stroke-width="1.5" stroke-dasharray="5 4"/>' +
           '<text x="' + (L + 4) + '" y="' + (Y(best.kg) - 4) + '" font-size="10" fill="#52514e">Prior best ' + num(best.kg) + ' (' + esc(shortDate(best.date)) + ')</text>';
    }
    var pts = entries.map(function (e) {
      var x = X(parseDate(e.date));
      return { x: x, top: Y(e.kg), est: Y(epley(e.kg, e.reps)) };
    });
    var path = function (k) { return pts.map(function (p, i) { return (i ? "L" : "M") + p.x.toFixed(1) + " " + p[k].toFixed(1); }).join(" "); };
    s += '<path d="' + path("est") + '" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linejoin="round"/>';
    s += '<path d="' + path("top") + '" fill="none" stroke="#eb6834" stroke-width="2" stroke-linejoin="round"/>';
    pts.forEach(function (p) {
      s += '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.est.toFixed(1) + '" r="3" fill="#2a78d6" stroke="#fcfcfb" stroke-width="1.5"/>' +
           '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.top.toFixed(1) + '" r="4" fill="#eb6834" stroke="#fcfcfb" stroke-width="1.5"/>';
    });
    s += '<line class="cross" x1="0" x2="0" y1="' + T + '" y2="' + (H - B) + '" stroke="#0b0b0b" stroke-width="1" visibility="hidden"/>';
    return { svg: s + '</svg>', xs: pts.map(function (p) { return p.x; }), W: W };
  }

  function setList(entries, lift, listKey) {
    if (!entries.length) return '<p class="muted small">No sets logged.</p>';
    var canMove = lift.others && lift.others.length;
    return '<ul class="sets">' + entries.map(function (e) {
      var mv = "";
      if (canMove) {
        var label = e._moved ? "Undo"
          : listKey === lift.key ? "Move to " + lift.others[0].name
          : "Count as " + lift.name;
        mv = '<span class="mv">' +
          (e._moved ? '<span class="tag">Moved</span>Logged as ' + esc(listName(lift, e._src)) + '. ' : '') +
          '<button class="link" data-move="' + esc(moveKey(e._src, e)) + '">' + esc(label) + '</button></span>';
      }
      return '<li><span class="d">' + esc(shortDate(e.date)) + '</span><span>' + esc(e.text) + '</span>' +
        '<span class="e">est ' + num(Math.round(epley(e.kg, e.reps) * 10) / 10) + '</span>' +
        (e.note ? '<span class="n">"' + esc(e.note) + '"</span>' : '') + mv + '</li>';
    }).join("") + '</ul>';
  }

  function renderTrends() {
    $("histStart").textContent = athlete.historyStart ? shortDate(athlete.historyStart) : "[Insert history start]";
    $("histNote").textContent = athlete.historyNote || "";
    var log = athlete.log || {};
    var x0 = parseDate(athlete.historyStart);
    var x1 = athlete.meet && athlete.meet.date ? parseDate(athlete.meet.date) : new Date();
    var html = "";
    // Keep fold-outs open or closed across a redraw.
    var wasOpen = {};
    Array.prototype.forEach.call(document.querySelectorAll("#trends details[data-d]"), function (d) {
      wasOpen[d.getAttribute("data-d")] = d.open;
    });
    var openAttr = function (key, dflt) { return (key in wasOpen ? wasOpen[key] : dflt) ? " open" : ""; };
    C.lifts.forEach(function (lift) {
      var entries = listEntries(lift, lift.key);
      var best = athlete.priorBests && athlete.priorBests[lift.key];
      html += '<div class="card"><h3>' + esc(lift.name) + '</h3>';
      if (entries.length) {
        html += '<div class="legend"><span><span class="key" style="border-color:#eb6834"></span>Top set (kg)</span>' +
          '<span><span class="key" style="border-color:#2a78d6"></span>Estimated max</span>' +
          (best ? '<span><span class="key dash"></span>Prior best</span>' : '') + '</div>' +
          '<div class="chartwrap" data-lift="' + lift.key + '">' + chartSvg(entries, best, x0, x1).svg + '<div class="tip"></div></div>';
      }
      if (best) {
        html += '<p class="small muted" style="margin:8px 0 0">Prior best: ' + num(best.kg) + ' on ' + esc(shortDate(best.date)) +
          (best.note ? '. ' + esc(best.note) : '') + '</p>';
      } else {
        html += '<p class="small muted" style="margin:8px 0 0">[Insert prior best]</p>';
      }
      html += '<details data-d="' + lift.key + '"' + openAttr(lift.key, true) + '><summary>Top sets (' + entries.length + ')</summary>' + setList(entries, lift, lift.key) + '</details>';
      (lift.others || []).forEach(function (o) {
        var oe = listEntries(lift, o.key);
        if (!oe.length && !(log[o.key] || []).length) return;
        html += '<details data-d="' + o.key + '"' + openAttr(o.key, false) + '><summary>' + esc(o.name) + ' (' + oe.length + ')</summary>' + setList(oe, lift, o.key) + '</details>';
      });
      html += '</div>';
    });
    $("trends").innerHTML = html;

    // hover / tap: show the nearest logged day
    Array.prototype.forEach.call(document.querySelectorAll(".chartwrap"), function (wrap) {
      var key = wrap.getAttribute("data-lift");
      var entries = listEntries(C.lifts.filter(function (l) { return l.key === key; })[0], key);
      var info = chartSvg(entries, null, x0, x1);
      var svg = wrap.querySelector("svg"), tip = wrap.querySelector(".tip"), cross = wrap.querySelector(".cross");
      function move(ev) {
        var r = svg.getBoundingClientRect();
        var vx = (ev.clientX - r.left) / r.width * info.W, bestI = 0;
        info.xs.forEach(function (x, i) { if (Math.abs(x - vx) < Math.abs(info.xs[bestI] - vx)) bestI = i; });
        var e = entries[bestI], px = info.xs[bestI] / info.W * r.width;
        cross.setAttribute("x1", info.xs[bestI]); cross.setAttribute("x2", info.xs[bestI]);
        cross.setAttribute("visibility", "visible");
        tip.innerHTML = '<b>' + esc(shortDate(e.date)) + '</b><br>' + esc(e.text) +
          '<br>Est max ' + num(Math.round(epley(e.kg, e.reps) * 10) / 10) + (e.note ? '<br>"' + esc(e.note) + '"' : '');
        tip.style.display = "block";
        var left = px + 10;
        if (left + tip.offsetWidth > r.width) left = Math.max(0, px - tip.offsetWidth - 10);
        tip.style.left = left + "px";
      }
      function hide() { tip.style.display = "none"; cross.setAttribute("visibility", "hidden"); }
      svg.addEventListener("pointermove", move);
      svg.addEventListener("pointerdown", move);
      svg.addEventListener("pointerleave", hide);
    });
  }

  $("trends").addEventListener("click", function (ev) {
    var key = ev.target.getAttribute && ev.target.getAttribute("data-move");
    if (!key) return;
    if (saved.moved[key]) delete saved.moved[key]; else saved.moved[key] = true;
    persist();
    renderTrends(); renderTMs();
  });

  // ---------- 4. training maxes ----------
  function tmBestHtml(lift) {
    var b = heaviestSingle(lift), cur = tm(lift.key);
    if (!b) return "";
    var s = 'Heaviest logged single: ' + num(b.kg) + ' on ' + esc(shortDate(b.date)) + '.';
    if (b.kg > cur) {
      s += ' <b style="color:var(--bad)">Above this training max.</b> ' +
        '<button class="link" data-usetm="' + lift.key + '" data-kg="' + b.kg + '">Use ' + num(b.kg) + '</button>';
    }
    return s;
  }
  function renderTMs() {
    var html = "";
    C.lifts.forEach(function (lift) {
      var f = (athlete.trainingMaxes && athlete.trainingMaxes[lift.key]) || null;
      var cur = tm(lift.key);
      var edited = f && cur !== f.kg;
      html += '<div class="card"><h3>' + esc(lift.name) + '</h3><div class="tmrow">' +
        '<input type="number" inputmode="decimal" step="' + C.roundingKg + '" min="0" value="' + (cur || "") + '" data-tm="' + lift.key + '" aria-label="' + esc(lift.name) + ' training max in kg">' +
        '<span>kg</span><span class="muted" data-tmlb="' + lift.key + '">' + (cur ? lb(cur) + " lb" : "") + '</span>' +
        (f ? (f.approved
            ? '<span class="badge ok">Approved' + (f.approvedOn ? " " + esc(shortDate(f.approvedOn)) : "") + '</span>'
            : '<span class="badge no">Proposed, not approved</span>')
          : '<span class="badge no">[Insert training max]</span>') +
        '</div>' +
        (f && f.reason ? '<p class="small muted" style="margin:8px 0 0">' + esc(f.reason) + '</p>' : '') +
        '<p class="small" style="margin:6px 0 0" data-tmedit="' + lift.key + '">' +
          (edited ? 'Edited here. File says ' + num(f.kg) + '. <button class="link" data-reset="' + lift.key + '">Reset</button>' : '') + '</p>' +
        '<p class="small muted" style="margin:6px 0 0" data-tmbest="' + lift.key + '">' + tmBestHtml(lift) + '</p>' +
        '</div>';
    });
    $("tms").innerHTML = html;
  }

  $("tms").addEventListener("input", function (ev) {
    var key = ev.target.getAttribute("data-tm");
    if (!key) return;
    var v = parseFloat(ev.target.value);
    var f = athlete.trainingMaxes && athlete.trainingMaxes[key];
    if (v > 0 && !(f && v === f.kg)) saved.tm[key] = v; else delete saved.tm[key];
    persist();
    var cur = tm(key);
    document.querySelector('[data-tmlb="' + key + '"]').textContent = cur ? lb(cur) + " lb" : "";
    document.querySelector('[data-tmedit="' + key + '"]').innerHTML = (f && cur !== f.kg)
      ? 'Edited here. File says ' + num(f.kg) + '. <button class="link" data-reset="' + key + '">Reset</button>' : '';
    document.querySelector('[data-tmbest="' + key + '"]').innerHTML =
      tmBestHtml(C.lifts.filter(function (l) { return l.key === key; })[0]);
    renderAttempts(); renderWarmups();
  });
  $("tms").addEventListener("click", function (ev) {
    var use = ev.target.getAttribute("data-usetm");
    if (use) {
      var kg = parseFloat(ev.target.getAttribute("data-kg"));
      var ff = athlete.trainingMaxes && athlete.trainingMaxes[use];
      if (ff && ff.kg === kg) delete saved.tm[use]; else saved.tm[use] = kg;
      persist();
      renderTMs(); renderAttempts(); renderWarmups();
      return;
    }
    var key = ev.target.getAttribute("data-reset");
    if (!key) return;
    delete saved.tm[key]; persist();
    renderTMs(); renderAttempts(); renderWarmups();
  });

  // ---------- 5. attempts (plan view) ----------
  function noteFor(liftKey) { return (saved.liftNotes && saved.liftNotes[liftKey]) || ""; }
  function setNote(liftKey, text) {
    saved.liftNotes = saved.liftNotes || {};
    saved.liftNotes[liftKey] = text;
    persist();
  }

  function renderAttempts() {
    var html = "";
    C.lifts.forEach(function (lift) {
      var p = picks(lift.key);
      for (var j = 0; j < p.length; j++) { if (typeof p[j] !== "number") p[j] = null; }

      html += '<div class="card"><h3>' + esc(lift.name) + ' <span class="muted small">of ' + num(tm(lift.key)) + ' kg</span></h3>';
      if (!tm(lift.key)) { html += '<p class="muted small">Set a training max first.</p></div>'; return; }
      C.attempts.forEach(function (att, i) {
        var mine = p[i];
        var kg = pickedKg(lift.key, i), prev = i > 0 ? pickedKg(lift.key, i - 1) : null;
        var bad = kg !== null && prev !== null && kg - prev < C.minJumpKg - 1e-9;
        html += '<div class="attempt' + (bad ? ' bad' : '') + '"><div class="lbl">' + esc(att.name) + '</div><div class="opts">';
        optionGroups(lift.key, i).forEach(function (g) {
          var on = typeof mine === "number" && g.tiers.indexOf(mine) !== -1;
          html += '<button class="opt' + (on ? ' on' : '') + '" aria-pressed="' + on + '" data-lift="' + lift.key + '" data-att="' + i + '" data-tier="' + g.tiers[0] + '">' +
            '<span class="t">' + g.tiers.map(function (t) { return esc(C.attemptOptions[t]); }).join(" / ") + '</span>' +
            '<span class="w">' + num(g.kg) + '</span>' +
            '<span class="l">' + lb(g.kg) + ' lb · ' + g.pcts.join("/") + '%</span></button>';
        });
        html += '</div>';
        if (bad) html += '<div class="warn">Needs to be at least ' + num(C.minJumpKg) + ' kg over the ' + esc(C.attempts[i - 1].name.toLowerCase()) + ' (' + num(prev) + ').</div>';
        html += '</div>';
      });
      html += '<label class="lnote-p">Notes<textarea data-note="' + lift.key + '" rows="2" placeholder="Cues, rack height, what to watch">' + esc(noteFor(lift.key)) + '</textarea></label>';
      html += '</div>';
    });
    $("attempts").innerHTML = html;
    renderTotals();
    renderSheet();
  }

  $("attempts").addEventListener("click", function (ev) {
    var b = ev.target.closest ? ev.target.closest(".opt") : null;
    if (!b) return;
    var key = b.getAttribute("data-lift"), i = +b.getAttribute("data-att"), tier = +b.getAttribute("data-tier");
    var p = picks(key);
    var groupTiers = optionGroups(key, i).filter(function (g) { return g.tiers.indexOf(tier) !== -1; })[0].tiers;
    p[i] = (typeof p[i] === "number" && groupTiers.indexOf(p[i]) !== -1) ? null : tier;
    persist();
    renderAttempts(); renderWarmups();
  });
  $("attempts").addEventListener("input", function (ev) {
    var key = ev.target.getAttribute && ev.target.getAttribute("data-note");
    if (key) { setNote(key, ev.target.value); renderSheet(); }
  });

  function renderTotals() {
    function total(attIdx) {
      var sum = 0, missing = [];
      C.lifts.forEach(function (lift) {
        var kg = pickedKg(lift.key, attIdx);
        if (kg === null) missing.push(lift.name.toLowerCase()); else sum += kg;
      });
      return missing.length
        ? '<div class="big muted">--</div><div class="small muted">Pick a ' + esc(C.attempts[attIdx].name) + ' for: ' + esc(missing.join(", ")) + '</div>'
        : '<div class="big">' + num(sum) + ' kg</div><div class="small muted">' + lb(sum) + ' lb</div>';
    }
    $("totals").innerHTML =
      '<div class="card"><h3>Projected total</h3><div class="small muted">Selected 3rds</div>' + total(2) + '</div>' +
      '<div class="card"><h3>Made 2nds total</h3><div class="small muted">If the selected 2nds are the last makes</div>' + total(1) + '</div>';
  }

  // ---------- 7. meet week ----------
  function renderWeek() {
    var wk = athlete.meetWeek || [], today = todayStr();
    $("week").innerHTML = wk.length
      ? '<ul class="week">' + wk.map(function (d) {
          var dt = parseDate(d.date);
          return '<li class="' + (d.date === today ? "today" : d.date < today ? "past" : "") + '"><span class="d">' +
            DAYS[dt.getDay()] + " " + esc(shortDate(d.date)) + (d.date === today ? '<br><span class="small">Today</span>' : '') +
            '</span><span>' + esc(d.plan) + '</span></li>';
        }).join("") + '</ul>'
      : '<p class="muted" style="margin:0">[Insert meet week plan]</p>';
  }

  // ---------- 8. flags ----------
  function renderFlags() {
    var f = athlete.flags || [];
    $("flags").innerHTML = f.length
      ? '<div class="flags"><h3>Flags</h3><ul>' + f.map(function (x) {
          return '<li><b>' + esc(x.type) + ':</b>' + esc(x.text) + '</li>';
        }).join("") + '</ul></div>'
      : '';
  }

  // ---------- 9. print sheet (attempts + warm-ups, one page) ----------
  function renderSheet() {
    var m = athlete.meet || {};
    var ins = function (v, label) { return v ? esc(v) : "[Insert " + label + "]"; };
    var h = '<h1>' + esc(athlete.name) + '</h1>' +
      '<p>' + ins(m.name, "meet name") + ' · ' + (m.date ? esc(longDate(m.date)) : "[Insert meet date]") + '</p>' +
      '<p>Federation: ' + ins(m.federation, "federation") + ' · Weight class: ' + ins(m.weightClass, "weight class") +
      ' · Weigh-in: ' + ins(m.weighIn, "weigh-in time") + '</p>';

    h += '<h2>Attempts (kg)</h2><table><thead><tr><th>Lift</th>' +
      C.attempts.map(function (a) { return '<th>' + esc(a.name) + '</th>'; }).join("") + '</tr></thead><tbody>';
    var sum = 0, all = true;
    C.lifts.forEach(function (lift) {
      h += '<tr><th>' + esc(lift.name) + '</th>';
      C.attempts.forEach(function (a, i) {
        var kg = pickedKg(lift.key, i);
        if (i === C.attempts.length - 1) { if (kg === null) all = false; else sum += kg; }
        h += '<td><div class="pick">' + (kg !== null ? num(kg) + ' <span style="font-size:11px;font-weight:400">' + lb(kg) + ' lb</span>' : '______') +
          '</div><div class="alts">' + optionGroups(lift.key, i).map(function (g) {
            return g.tiers.map(function (t) { return esc(C.attemptOptions[t]); }).join("/") + " " + num(g.kg);
          }).join(" · ") + '</div><div class="alts"><span class="box" style="margin-left:0"></span>Good<span class="box"></span>Miss</div></td>';
      });
      h += '</tr>';
    });
    h += '</tbody></table><p style="margin-top:6px"><b>Projected total:</b> ' + (all ? num(sum) + ' kg (' + lb(sum) + ' lb)' : '______') + '</p>';

    var noted = C.lifts.filter(function (l) { return noteFor(l.key); });
    if (noted.length) h += '<h2>Notes</h2>' + noted.map(function (l) { return '<p><b>' + esc(l.name) + ':</b> ' + esc(noteFor(l.key)) + '</p>'; }).join("");

    h += '<h2>Warm-ups (plates per side, ' + num(C.plates.barKg) + ' kg bar' +
      (C.plates.collarKgEach > 0 ? ', ' + num(C.plates.collarKgEach) + ' kg collars' : '') + ')</h2><div class="wu">';
    C.lifts.forEach(function (lift) {
      var w = C.warmups[lift.key], opener = pickedKg(lift.key, 0);
      h += '<div><h3>' + esc(lift.name) + (opener !== null ? ' · opener ' + num(opener) : '') + '</h3>';
      if (!w || opener === null) { h += '<p>No opener picked.</p></div>'; return; }
      h += '<table><thead><tr><th>kg</th><th>Reps</th><th>Per side</th></tr></thead><tbody>';
      if (w.barReps > 0) h += '<tr><td>' + num(C.plates.barKg) + '</td><td>×' + w.barReps + '</td><td>Empty bar</td></tr>';
      w.steps.forEach(function (s) {
        var kg = roundKg(opener * s.pct / 100);
        h += '<tr><td><b>' + num(kg) + '</b></td><td>×' + s.reps + '</td><td>' + esc(plateText(kg)) + '</td></tr>';
      });
      h += '</tbody></table>' + (w.note ? '<p>' + esc(w.note) + '</p>' : '') + '</div>';
    });
    h += '</div><p style="margin-top:10px"><b>Timing:</b> ' + esc(C.warmupTimingNote) + '</p>';
    $("sheet").innerHTML = h;
  }
  $("printBtn").addEventListener("click", function () { window.print(); });

  // ---------- 6. warm-ups ----------
  function plateText(kg, collarsOn) {
    var P = C.plates, bar = P.barKg;
    var collars = collarsOn === false ? 0 : (P.collarKgEach || (collarsOn ? 2.5 : 0)) * 2;
    if (kg <= bar + 1e-9) return "Empty bar";
    var load = kg - bar;
    var useCollars = collars > 0 && load >= collars - 1e-9;
    var side = (load - (useCollars ? collars : 0)) / 2, out = [];
    P.availableKg.forEach(function (p) {
      while (side >= p - 1e-9) { out.push(num(p)); side -= p; }
    });
    var txt = out.length ? out.join(", ") : "";
    if (useCollars) txt += (txt ? " + " : "") + "collar";
    else if (collars > 0) txt += " (no collars)";
    if (side > 1e-6) txt += " (" + num(side) + " short per side)";
    return txt;
  }

  function renderWarmups() {
    var html = "";
    C.lifts.forEach(function (lift) {
      var w = C.warmups[lift.key], opener = pickedKg(lift.key, 0);
      html += '<div class="card"><h3>' + esc(lift.name) + '</h3>';
      if (!w) { html += '<p class="muted small">No warm-up plan in config.js.</p></div>'; return; }
      if (opener === null) { html += '<p class="muted small">Pick an opener to build warm-ups.</p></div>'; return; }
      html += '<p class="small muted" style="margin:0 0 6px">Opener ' + num(opener) + ' kg (' + lb(opener) + ' lb)</p>' +
        '<table><thead><tr><th>Weight</th><th>Reps</th><th>Per side</th></tr></thead><tbody>';
      if (w.barReps > 0) html += '<tr><td class="wt">' + num(C.plates.barKg) + ' kg</td><td>×' + w.barReps + '</td><td>Empty bar</td></tr>';
      w.steps.forEach(function (s) {
        var kg = roundKg(opener * s.pct / 100);
        html += '<tr><td class="wt">' + num(kg) + ' kg <span class="muted small" style="font-weight:400">' + lb(kg) + ' lb</span></td><td>×' + s.reps +
          '</td><td>' + esc(plateText(kg)) + ' <span class="muted small">' + s.pct + '%</span></td></tr>';
      });
      html += '</tbody></table>';
      if (w.note) html += '<div class="note">' + esc(w.note) + '</div>';
      html += '</div>';
    });
    $("warmups").innerHTML = html;
    $("timing").textContent = C.warmupTimingNote + " Plates per side on a " + num(C.plates.barKg) + " kg bar" +
      (C.plates.collarKgEach > 0 ? " with " + num(C.plates.collarKgEach) + " kg collars." : ", no collar weight counted.");
  }

  // =====================================================================
  // MEET DAY MODE. Dark card modeled on the Worlds meet day card:
  // session clock, lifters-till-up counter, live board, flight plan,
  // editable attempts with good/miss pills, warm-up flow, subtotals,
  // chase calc. Everything here saves per athlete on this device.
  // =====================================================================
  var MD = C.meetDay || { lastWarmupOut: 8, warmupSpacing: 5, minutesPerAttempt: 1 };
  var dayOn = false;

  function f1(n) { return (+n).toFixed(1).replace(/\.0$/, ""); }
  function firstName() { return String(athlete.name).split(" ")[0]; }
  function shortOf(lift) { return lift.short || lift.name.slice(0, 2).toUpperCase(); }
  function liftByKey(k) { return C.lifts.filter(function (l) { return l.key === k; })[0]; }
  function liftIdx(k) { for (var i = 0; i < C.lifts.length; i++) { if (C.lifts[i].key === k) return i; } return 0; }

  function defaultWu(k, opener) {
    var w = C.warmups[k];
    if (!w || !(opener > 0)) return [];
    var rows = [];
    if (w.barReps > 0) rows.push(["Empty bar", num(C.plates.barKg), String(w.barReps)]);
    w.steps.forEach(function (s, i) {
      rows.push([i === w.steps.length - 1 ? "Last warm-up" : "Warm-up", num(roundKg(opener * s.pct / 100)), String(s.reps)]);
    });
    var n = rows.length;
    // row = [name, kg, reps, done, stamped time, lifters out, done-at]
    return rows.map(function (r, i) {
      return [r[0], r[1], r[2], false, null, String(MD.lastWarmupOut + MD.warmupSpacing * (n - 1 - i)), null];
    });
  }
  // Attempts to start from: baked "attempts" in athletes.js, else the plan picks.
  function planAttempts(k) {
    var baked = (athlete.attempts || {})[k] || [];
    return C.attempts.map(function (a, i) {
      var kg = (baked[i] !== undefined && baked[i] !== null && baked[i] !== "") ? +baked[i] : pickedKg(k, i);
      return { kg: (kg === null || kg === undefined || isNaN(kg)) ? "" : num(kg), st: "" };
    });
  }
  function dayState() {
    var d = saved.day || (saved.day = {});
    d.att = d.att || {}; d.wu = d.wu || {}; d.fl = d.fl || {}; d.cnt = d.cnt || {};
    d.fp = d.fp || {}; d.open = d.open || {};
    if (!d.lift || !liftByKey(d.lift)) d.lift = C.lifts[0].key;
    if (d.collars === undefined) d.collars = C.plates.collarKgEach > 0;
    C.lifts.forEach(function (lift) {
      var k = lift.key;
      if (!d.att[k]) d.att[k] = planAttempts(k);
      if (!d.wu[k]) d.wu[k] = defaultWu(k, parseFloat(d.att[k][0].kg));
      if (!d.fl[k]) d.fl[k] = ["", "", ""];
      if (d.cnt[k] === undefined) d.cnt[k] = null;
    });
    return d;
  }
  function dayPlates(kg) {
    var n = parseFloat(kg);
    if (isNaN(n) || n < C.plates.barKg) return "";
    if (n === C.plates.barKg) return "empty bar";
    var t = plateText(n, dayState().collars).replace(" + collar", "").replace(/^collar$/, "collars only");
    return t + " / side";
  }
  function fmtTime(d) {
    var h = d.getHours(), m = d.getMinutes(), ap = h >= 12 ? "p" : "a";
    h = h % 12 || 12;
    return h + ":" + (m < 10 ? "0" : "") + m + ap;
  }
  function fmtElapsed(ms) {
    var s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
    var p = function (n) { return (n < 10 ? "0" : "") + n; };
    return (h ? h + ":" + p(m) : m) + ":" + p(x);
  }

  // ----- render: whole card -----
  function renderDay() {
    var d = dayState(), m = athlete.meet || {};
    var bits = [];
    if (m.date) bits.push(longDate(m.date));
    if (m.federation) bits.push(m.federation);
    if (m.weightClass) bits.push(m.weightClass);
    if (m.weighIn) bits.push("Weigh-in " + m.weighIn);
    bits.push("Training maxes " + C.lifts.map(function (l) { return num(tm(l.key)); }).join(" / "));

    $("day").innerHTML =
      '<div class="dtop"><span class="eyebrow">MASS Strength · Meet day</span><span class="chips">' +
        ATHLETES.map(function (a) {
          return '<button class="achip' + (a.id === athlete.id ? ' on' : '') + '" data-act="ath" data-id="' + esc(a.id) + '">' + esc(String(a.name).split(" ")[0]) + '</button>';
        }).join("") +
        '<button class="pbtn" data-act="plan">Plan view</button></span></div>' +
      '<header><h1>' + esc(firstName()) + (m.name ? ' · ' + esc(m.name) : '') + '</h1><div class="sub">' + esc(bits.join(" · ")) + '</div></header>' +

      '<div class="stick">' +
        '<div class="clock">' +
          '<div class="ck" id="d-sess" data-act="clocktap"><div class="cl-lab"><span>Session</span><button class="crst" id="d-crst" data-act="clockreset" style="display:none">reset</button></div>' +
            '<div class="cl-time" id="d-cltime">0:00</div><div class="cl-hint" id="d-clhint">tap to start</div></div>' +
          '<div class="ck" id="d-last"><div class="cl-lab"><span>Last set</span></div><div class="cl-time" id="d-lstime">--</div><div class="cl-hint" id="d-lshint">check off a warm-up</div></div>' +
        '</div>' +
        '<div class="ctr' + (d.ctrClosed ? ' closed' : '') + '" id="d-ctr"><div class="ctr-top"><div class="lchips">' +
          C.lifts.map(function (l, i) { return '<button class="lchip l' + i + '" data-act="setlift" data-lift="' + l.key + '">' + esc(shortOf(l)) + '</button>'; }).join("") +
          '</div><button class="cbtn minus" data-act="bump" data-d="-1">&minus;1</button>' +
          '<input id="d-cnum" inputmode="numeric" placeholder="#">' +
          '<span class="clab">lifters<br>till up</span><button class="cbtn plus" data-act="bump" data-d="1">+1</button></div>' +

          '<button class="fold" id="d-fold" data-act="fold" aria-label="Show or hide counter">' + (d.ctrClosed ? '&#9660;' : '&#9650;') + '</button></div></div>' +
      '</div>' +

      '<div class="board" id="d-board"><div class="board-bar"><button data-act="board"><span id="d-boardlab">&#9654; Live board (LiftingCast)</span></button>' +
        '<a id="d-boardext" target="_blank" rel="noopener"' + (boardUrl() ? ' href="' + esc(boardUrl()) + '"' : ' style="display:none"') + '>open full</a></div>' +
        '<div class="board-url"><input id="d-boardurl" inputmode="url" placeholder="Paste the LiftingCast board link" value="' + esc(d.board || "") + '"></div>' +
